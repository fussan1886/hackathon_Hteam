{% extends 'base.html' %}

{% block title %}投稿する - ぬまりば {% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/post/posts.css') }}">
{% endblock %}

{% block content %}
<section class="post-form-container">
    <h1>投稿</h1>

    <form method="post" enctype="multipart/form-data" action="{{ url_for('posts.post_create') }}">
        {% if form %}
        {{ form.hidden_tag() }}
        {% endif %}

        <div class="form-group">
            <label for="content">投稿内容</label>
            <textarea id="content" name="content" rows="8" maxlength="2000" placeholder="こだわりの豆や道具、お気に入りのお店などを投稿しよう"
                required>{{ request.form.get('content', '') }}</textarea>
        </div>

        <div class="form-group">
            <label for="category_id">カテゴリー</label>
            <label>
                <input type="checkbox" name="category" value="recipe"> レシピ
            </label>

            <label>
                <input type="checkbox" name="category" value="tool"> 道具
            </label>

            <label>
                <input type="checkbox" name="category" value="store"> 店舗
            </label>

            <label>
                <input type="checkbox" name="category" value="chat"> 雑談
            </label>

            <label>
                <input type="checkbox" name="category" value="snack"> おやつ
            </label>

            <label>
                <input type="checkbox" name="category" value="coffee"> コーヒー日記
            </label>

            <select id="category_id" name="category_id" required>
                <option value="">選択してください</option>

                {% for category in categories %}
                <option value="{{ category.id }}" {% if request.form.get('category_id')|int==category.id %}selected{%
                    endif %}>

                    {{ category.category_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="image">投稿画像</label>
            <input type="file" id="image" name="image" accept="image/jpeg, image/png, image/webp" multiple>
            <p>JPEG, PNG, WebP形式の画像を選択してください。</p>
        </div>

        <button type="submit">投稿する</button>
    </form>
</section>
{% endblock %}
